name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  personal-data-scan:
    name: Personal data scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a real preferences file was committed
        run: |
          set -euo pipefail
          # These filenames must only ever exist locally (see .gitignore).
          # If git is tracking one, personalization has leaked into the public repo.
          matches=$(git ls-files | grep -E '(^|/)(\.claude/preferences\.ya?ml|skills-preferences\.ya?ml)$' || true)
          if [ -n "$matches" ]; then
            echo "::error::A local preferences file is tracked by git — it must stay gitignored:"
            echo "$matches"
            exit 1
          fi

      - name: Flag committed absolute home directory paths
        run: |
          set -euo pipefail
          matches=$(git grep -InE '/(home|Users)/[A-Za-z0-9_.-]+' -- . ':!*.git*' || true)
          if [ -n "$matches" ]; then
            echo "::warning::Possible absolute home directory path(s) committed — review before release:"
            echo "$matches"
          fi

  skills-validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate skill frontmatter, references, and evals
        run: python3 tools/validate_skills.py

  plugin-manifest-validate:
    name: Validate plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate .claude-plugin/*.json
        run: |
          set -euo pipefail
          python3 -c "
          import json
          plugin = json.load(open('.claude-plugin/plugin.json'))
          for field in ('name', 'description'):
              assert field in plugin, f'plugin.json missing required field: {field}'

          marketplace = json.load(open('.claude-plugin/marketplace.json'))
          for field in ('name', 'owner', 'plugins'):
              assert field in marketplace, f'marketplace.json missing required field: {field}'
          assert isinstance(marketplace['plugins'], list) and marketplace['plugins'], 'marketplace.json plugins must be a non-empty list'
          for entry in marketplace['plugins']:
              for field in ('name', 'source'):
                  assert field in entry, f'marketplace.json plugin entry missing required field: {field}'
          print('Plugin manifests OK.')
          "

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            **/*.md
            !docs/PLAN.md
