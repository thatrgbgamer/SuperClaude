name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  personal-data-scan:
    name: Personal data scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a real preferences file was committed
        run: |
          set -euo pipefail
          # These filenames must only ever exist locally (see .gitignore).
          # If git is tracking one, personalization has leaked into the public repo.
          matches=$(git ls-files | grep -E '(^|/)(\.claude/preferences\.ya?ml|skills-preferences\.ya?ml)$' || true)
          if [ -n "$matches" ]; then
            echo "::error::A local preferences file is tracked by git — it must stay gitignored:"
            echo "$matches"
            exit 1
          fi

      - name: Flag committed absolute home directory paths
        run: |
          set -euo pipefail
          matches=$(git grep -InE '/(home|Users)/[A-Za-z0-9_.-]+' -- . ':!*.git*' || true)
          if [ -n "$matches" ]; then
            echo "::warning::Possible absolute home directory path(s) committed — review before release:"
            echo "$matches"
          fi

  skills-validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate skill frontmatter, references, and evals
        run: |
          set -euo pipefail
          if [ ! -d skills ] || [ -z "$(ls -A skills 2>/dev/null)" ]; then
            echo "No skills/ directory yet — nothing to validate."
            exit 0
          fi
          if [ -f tools/validate_skills.py ]; then
            python3 tools/validate_skills.py
            exit $?
          fi
          echo "tools/validate_skills.py not built yet (Phase 4) — running the minimal inline checks below instead."
          python3 - <<'PY'
          import json, re, sys
          from pathlib import Path

          fail = False

          def error(msg):
              global fail
              print(f"::error::{msg}")
              fail = True

          def warn(msg):
              print(f"::warning::{msg}")

          for skill_dir in sorted(Path("skills").iterdir()):
              if not skill_dir.is_dir():
                  continue
              name = skill_dir.name
              skill_md = skill_dir / "SKILL.md"
              if not skill_md.exists():
                  error(f"{name}: missing SKILL.md")
                  continue

              text = skill_md.read_text()
              lines = text.splitlines()

              if not lines or lines[0].strip() != "---":
                  error(f"{name}: SKILL.md must start with a '---' frontmatter block")
              else:
                  try:
                      end = lines[1:].index("---") + 1
                  except ValueError:
                      error(f"{name}: SKILL.md frontmatter block is never closed with '---'")
                      end = None
                  if end is not None:
                      frontmatter = lines[1:end]
                      fm_name = next((l.split(":", 1)[1].strip() for l in frontmatter if l.startswith("name:")), None)
                      fm_desc = next((l for l in frontmatter if l.startswith("description:")), None)
                      if fm_name != name:
                          error(f"{name}: frontmatter name '{fm_name}' must match directory name")
                      if not fm_desc or len(fm_desc.split(":", 1)[1].strip()) < 20:
                          error(f"{name}: frontmatter description is missing or too short")
                      elif len(fm_desc) > 1500:
                          warn(f"{name}: frontmatter description is over 1500 characters — consider tightening it")

              line_count = len(lines)
              if line_count > 600:
                  error(f"{name}: SKILL.md is {line_count} lines, over the 600-line hard limit")
              elif line_count > 400:
                  warn(f"{name}: SKILL.md is {line_count} lines — consider moving detail into references/")

              for ref in set(re.findall(r'(?:references|scripts|assets)/[\w./-]+', text)):
                  if not (skill_dir / ref).exists():
                      error(f"{name}: SKILL.md references '{ref}', which does not exist")

              evals_path = skill_dir / "evals" / "evals.json"
              if not evals_path.exists():
                  error(f"{name}: missing evals/evals.json")
                  continue
              try:
                  evals = json.loads(evals_path.read_text())
              except json.JSONDecodeError as e:
                  error(f"{name}: evals/evals.json is not valid JSON ({e})")
                  continue
              prompts = evals.get("prompts", [])
              if len(prompts) < 2:
                  error(f"{name}: evals/evals.json needs at least two prompts, has {len(prompts)}")
              if not any(p.get("type") == "negative" for p in prompts):
                  error(f"{name}: evals/evals.json needs at least one negative-case prompt")

          sys.exit(1 if fail else 0)
          PY

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            **/*.md
            !docs/PLAN.md
