# SuperClaude repo defaults.
#
# This is the neutral fallback every skill assumes when a user has no
# preferences file of their own (no `.claude/preferences.yaml` and no
# `~/.claude/skills-preferences.yaml`). It is committed and public —
# it must never contain anything specific to one person.
#
# Do not edit this file to personalize your own setup. Copy
# config/preferences.example.yaml to ~/.claude/skills-preferences.yaml
# instead, or run the preferences-setup skill.
#
# See docs/PREFERENCES.md for what every key means.

identity:
  name: null
  timezone: null
  locale: en-US
  units: metric
  date_format: "YYYY-MM-DD"
  spelling: us

voice:
  formality: neutral
  verbosity: balanced
  humor: none
  emoji: rare
  hedging: low
  person: first

formatting:
  style: mixed
  heading_depth: shallow
  tables: when-helpful
  code_fence_language_tags: true
  banned_phrases: []
  max_length:
    chat: null
    document: null

stack:
  languages: []
  package_managers: []
  test_frameworks: []
  os: null
  shell: null
  editor: null
  container_runtime: null
  cloud_provider: null

workflow:
  commit_convention: null
  branch_naming: null
  pr_style: null
  review_depth: standard
  run_tests_before_proposing: true
  confirm_before_creating_files: false

content:
  platforms: []
  audience: null
  brand_voice_file: null

privacy:
  never_include: []
  redact: false
  placeholders_for_names_locations: false

safety:
  confirm_before_network_calls: false
  confirm_before_installing_packages: true

notes: ""
